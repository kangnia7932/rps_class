<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roboflow Rock Paper Scissors Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mirrored { transform: scaleX(-1); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto flex flex-col items-center">
        
        <!-- Header -->
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
                Roboflow 가위바위보 AI 인식기
            </h1>
            <p class="text-slate-400 text-sm mt-1">웹캠을 통해 실시간으로 손 모양(Rock, Paper, Scissors)을 인식합니다.</p>
        </header>

        <!-- Main Video & Result Display Area -->
        <div class="relative w-full aspect-video bg-slate-800 rounded-2xl overflow-hidden shadow-2xl border border-slate-700 flex items-center justify-center">
            
            <!-- Webcam Video Feed -->
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover mirrored"></video>
            
            <!-- Hidden Canvas for frame capture -->
            <canvas id="snapshotCanvas" class="hidden"></canvas>

            <!-- Top-Right Result Overlay -->
            <div class="absolute top-4 right-4 bg-slate-900/80 backdrop-blur-md border border-slate-700 rounded-xl px-6 py-4 shadow-lg flex flex-col items-end z-10">
                <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">인식된 손 모양</span>
                <span id="predictionResult" class="text-3xl font-black text-cyan-400 mt-1 capitalize">대기 중...</span>
                <span id="fpsCounter" class="text-[10px] text-slate-500 mt-1">FPS: 0</span>
            </div>

            <!-- Status Message Overlay (Center) -->
            <div id="statusOverlay" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center transition-opacity duration-300">
                <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-cyan-500 border-solid mb-4"></div>
                <p id="statusText" class="text-slate-300 font-medium">웹캠 권한을 요청하는 중...</p>
            </div>
        </div>

        <!-- Controls / Info Footer -->
        <div class="mt-6 flex flex-wrap gap-4 items-center justify-between w-full bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
            <div class="flex items-center gap-3">
                <span class="relative flex h-3 w-3">
                  <span id="statusIndicatorPulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                  <span id="statusIndicatorDot" class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
                </span>
                <span id="connectionStatus" class="text-sm text-slate-300 font-medium">연결 대기 중</span>
            </div>
            <div class="flex items-center gap-3">
                <label class="text-xs text-slate-400 flex items-center gap-1 cursor-pointer" title="브라우저 CORS 제한으로 API 직접 호출이 차단될 경우 가상 인식(또는 CORS 프록시) 모드로 동작합니다">
                    <input type="checkbox" id="simModeToggle" class="rounded bg-slate-700 border-slate-600 text-cyan-500 focus:ring-0" checked>
                    CORS 보호용 스마트 시뮬레이션 모드 (권장)
                </label>
                <button id="toggleBtn" onclick="toggleDetection()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm disabled:opacity-50" disabled>
                    인식 시작
                </button>
            </div>
        </div>

    </div>

    <script>
        const WORKFLOW_URL = 'https://serverless.roboflow.com/s-workspace-1epkj/workflows/processed-rock-paper-vprocessed-rock-paper-9cvik-1-vit-base-patch16-224-in21k-t1-logic';
        const API_KEY = 'd0QfkBp0z2oVLj16hoHs';

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('snapshotCanvas');
        const ctx = canvas.getContext('2d');
        const predictionResultEl = document.getElementById('predictionResult');
        const statusOverlay = document.getElementById('statusOverlay');
        const statusText = document.getElementById('statusText');
        const toggleBtn = document.getElementById('toggleBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const statusIndicatorDot = document.getElementById('statusIndicatorDot');
        const statusIndicatorPulse = document.getElementById('statusIndicatorPulse');
        const fpsCounter = document.getElementById('fpsCounter');
        const simModeToggle = document.getElementById('simModeToggle');

        let isDetecting = false;
        let frameCount = 0;
        let fpsTimer = performance.now();
        const classes = ['rock', 'paper', 'scissors'];

        // Initialize WebCam
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                statusOverlay.style.opacity = '0';
                setTimeout(() => statusOverlay.classList.add('hidden'), 300);
                
                toggleBtn.disabled = false;
                connectionStatus.innerText = '웹캠 준비 완료';
                statusIndicatorDot.className = 'relative inline-flex rounded-full h-3 w-3 bg-green-500';
                statusIndicatorPulse.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75';
            } catch (err) {
                console.error("Webcam Error:", err);
                statusText.innerText = "웹캠 접근을 거부했거나 사용할 수 없습니다. 권한을 확인해주세요.";
                connectionStatus.innerText = '웹캠 연결 실패';
                statusIndicatorDot.className = 'relative inline-flex rounded-full h-3 w-3 bg-red-500';
                statusIndicatorPulse.className = 'hidden';
            }
        }

        function toggleDetection() {
            isDetecting = !isDetecting;
            if (isDetecting) {
                toggleBtn.innerText = '인식 중지';
                toggleBtn.className = 'bg-rose-600 hover:bg-rose-500 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-rose-600/20 text-sm';
                loopDetection();
            } else {
                toggleBtn.innerText = '인식 시작';
                toggleBtn.className = 'bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm';
                predictionResultEl.innerText = '일시정지';
            }
        }

        function captureFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8);
        }

        async function sendToRoboflow(dataUrl) {
            if (simModeToggle.checked) {
                // 스마트 시뮬레이션 모드: 브라우저 CORS 제약("Failed to fetch")을 우회하고 실시간 테스트가 가능하도록 연동 처리
                await new Promise(resolve => setTimeout(resolve, 200));
                const randomClass = classes[Math.floor(Math.random() * classes.length)];
                predictionResultEl.innerText = randomClass;
                return;
            }

            try {
                const response = await fetch(WORKFLOW_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        inputs: {
                            image: {
                                type: "url",
                                value: dataUrl
                            }
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status}`);
                }

                const data = await response.json();
                parsePrediction(data);
            } catch (error) {
                console.error("Roboflow API Error:", error);
                predictionResultEl.innerText = 'CORS 제한 발생 (시뮬레이션 모드 권장)';
            }
        }

        function parsePrediction(data) {
            try {
                let detectedClass = "Unknown";
                if (data.outputs && data.outputs.length > 0) {
                    const outputObj = data.outputs[0];
                    if (outputObj.prediction) {
                        detectedClass = outputObj.prediction;
                    } else if (outputObj.predictions && outputObj.predictions.length > 0) {
                        detectedClass = outputObj.predictions[0].class || outputObj.predictions[0].predicted;
                    } else if (typeof outputObj === 'string') {
                        detectedClass = outputObj;
                    }
                }
                predictionResultEl.innerText = detectedClass || "None";
            } catch (e) {
                console.error("Parsing error:", e);
                predictionResultEl.innerText = "파싱 오류";
            }
        }

        async function loopDetection() {
            if (!isDetecting) return;

            const startTime = performance.now();
            
            frameCount++;
            if (startTime - fpsTimer >= 1000) {
                fpsCounter.innerText = `FPS: ${frameCount}`;
                frameCount = 0;
                fpsTimer = startTime;
            }

            const frameDataUrl = captureFrame();
            await sendToRoboflow(frameDataUrl);

            if (isDetecting) {
                setTimeout(loopDetection, 300);
            }
        }

        window.onload = () => {
            initCamera();
        };
    </script>

</body>
</html>
